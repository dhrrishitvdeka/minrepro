[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "minrepro"
version = "0.2.0"
description = "Structure-aware JSON/YAML config shrinker: smallest file that still fails your test."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "minrepro" }]
keywords = [
  "delta-debugging",
  "config",
  "yaml",
  "json",
  "minimize",
  "repro",
  "shrink",
  "kubernetes",
  "docker-compose",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
  "Topic :: Utilities",
]
dependencies = [
  "pyyaml>=6.0",
  "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
minrepro = "minrepro.cli:main"

[project.urls]
Homepage = "https://github.com/dhrrishitvdeka/minrepro"
Repository = "https://github.com/dhrrishitvdeka/minrepro"
Issues = "https://github.com/dhrrishitvdeka/minrepro/issues"
Changelog = "https://github.com/dhrrishitvdeka/minrepro/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/minrepro"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/examples",
  "/scripts",
  "/README.md",
  "/LICENSE",
  "/CHANGELOG.md",
  "/CONTRIBUTING.md",
  "/RELEASING.md",
  "/pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
